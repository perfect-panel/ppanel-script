services:
  ppanel-db:
    # 【必须和 test 同一种数据库】上游的 pg 支持是靠方言分支实现的
    # （db.Dialector.Name() 散布在各 repo），本机跑 MySQL 就复现不了 test 上
    # 的方言问题——那正是本机栈存在的意义。
    image: postgres:17.11-alpine
    container_name: ppanel-db
    restart: always
    networks:
      - ppanel-network
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ppanel
      POSTGRES_USER: ppanel
      POSTGRES_PASSWORD: ppanelpassword
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppanel -d ppanel"]
      interval: 10s
      timeout: 5s
      retries: 3

  ppanel-cache:
    image: redis:7.4.5
    container_name: ppanel-cache
    restart: always
    networks:
      - ppanel-network
    ports:
      - 6379:6379
    volumes:
      - ./cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ppanel-server:
    # 【构建本地源码，不拉上游镜像】上游 ppanel/*:latest 里没有我们 fork 的
    # 任何东西。本地跑着上游的代码开发我们自己的功能，等于没跑。
    build:
      context: ${PPANEL_SERVER_PATH:-../ppanel-server}
      dockerfile: Dockerfile
    image: ppanel-server:dev
    container_name: ppanel-server
    restart: always
    networks:
      - ppanel-network
    ports:
      - 8080:8080
    depends_on:
      ppanel-db:
        condition: service_healthy
      ppanel-cache:
        condition: service_healthy
    volumes:
      - ./config/ppanel.yaml:/app/etc/ppanel.yaml

  ppanel-admin:
    build:
      context: ${PPANEL_FRONTEND_PATH:-../ppanel-frontend}
      # 同目录那个 Dockerfile 只 COPY dist，要求先 bun run build；
      # .dev 这个从源码一路构建，compose 里不需要前置步骤。
      dockerfile: docker/ppanel-admin-web/Dockerfile.dev
    image: ppanel-admin-web:dev
    container_name: ppanel-admin-web
    restart: always
    networks:
      - ppanel-network
    ports:
      # 容器里是 nginx（Vite 产物），监听 80——不是 Next.js 时代的 3000
      - 3001:80
    depends_on:
      ppanel-server:
        condition: service_started

  ppanel-user:
    build:
      context: ${PPANEL_FRONTEND_PATH:-../ppanel-frontend}
      dockerfile: docker/ppanel-user-web/Dockerfile.dev
    image: ppanel-user-web:dev
    container_name: ppanel-user-web
    restart: always
    networks:
      - ppanel-network
    ports:
      - 3002:80
    depends_on:
      ppanel-server:
        condition: service_started

networks:
  ppanel-network:
    driver: bridge
