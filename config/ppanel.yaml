Host: 0.0.0.0
Port: 8080
Debug: false
JwtAuth:
  AccessSecret: 1234567890
  AccessExpire: 604800
Logger:
  ServiceName: PPanel
  Mode: console
  Encoding: plain
  TimeFormat: "2025-01-01 00:00:00.000"
  Path: logs
  Level: debug
  MaxContentLength: 0
  Compress: false
  Stat: true
  KeepDays: 0
  StackCooldownMillis: 100
  MaxBackups: 0
  MaxSize: 0
  Rotation: daily
  FileTimeFormat: 2025-01-01T00:00:00.000Z00:00
# 【键名是 Database 不是 MySQL】上游把 MySQL: 标为 Deprecated，仍能读但走
# 兼容路径。Config 的内容随 Driver 变，不能沿用 MySQL 那串 charset 参数。
Database:
  Driver: postgres
  Addr: ppanel-db:5432
  Dbname: ppanel
  Username: ppanel
  Password: ppanelpassword
  Config: sslmode=disable&TimeZone=Asia/Shanghai&application_name=perfect-panel
  MaxIdleConns: 10
  MaxOpenConns: 10
  SlowThreshold: 1000
Redis:
  Host: ppanel-cache:6379
  Pass:
  DB: 0
Administrator:
  Email: admin@ppanel.dev
  Password: password
